name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: gofmt, vet, staticcheck
        run: make lint
      - name: Tests (race detector, coverage)
        run: |
          make test
          go tool cover -func=coverage.out | tail -1 | awk '{print "Total coverage: " $NF}' >> "$GITHUB_STEP_SUMMARY"
      - name: govulncheck
        run: make vuln
      - name: Baseline eval matches the committed results
        run: make eval-check

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t llm-document-ingestion:ci .
      - name: Smoke test (eval inside the image, PDF path included)
        run: docker run --rm llm-document-ingestion:ci eval -n 40 -seed 1 > /dev/null
      - name: Smoke test (serve becomes healthy and ingests a file)
        run: |
          docker run -d --name ingest -p 127.0.0.1:8080:8080 llm-document-ingestion:ci
          for i in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ingest)" = healthy ] && break
            sleep 1
          done
          docker inspect -f '{{.State.Health.Status}}' ingest | grep -qx healthy
          curl -sf --data-binary @examples/doc-0003.txt 'http://127.0.0.1:8080/v1/ingest?filename=doc-0003.txt' | grep -q '"decision":"auto_accept"'
      - name: Server logs on failure
        if: failure()
        run: docker logs ingest || true
